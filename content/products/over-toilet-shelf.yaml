name: Honey-Can-Do 3-Tier Over-the-Toilet Shelf (Chrome)
badge: Renter-Friendly
category: bathroom-storage
guide: over-the-toilet-storage
description: A freestanding three-shelf metal unit that adds storage above the toilet with nothing mounted to the wall.
image: /img/products/over-toilet-shelf/image.jpg
imageAlt: Slim wood and white shelf over a toilet with rolled towels and baskets
imageType: illustrative
features:
- About 23 in W x 9.5 in D x 60 in H
- Three shelves, chrome finish
- Freestanding legs straddle the toilet
- Rubber feet protect the floor
pros:
- Uses the most-wasted wall in the bathroom
- No drilling into tile
- Easy to add baskets for small items
cons:
- Can be top-heavy — anchor it to the wall if your lease allows
- May block access to the tank lid if too low
check:
- Toilet tank width vs. inside leg width
- Floor-to-tank-top height (lowest shelf sits about 37.5 in up)
- Location of the water shut-off valve
