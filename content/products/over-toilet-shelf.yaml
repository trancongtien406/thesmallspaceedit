name: Freestanding Over-the-Toilet Shelf
badge: Renter-Friendly
category: bathroom-storage
guide: over-the-toilet-storage
description: Adds two to three shelves above the toilet with nothing mounted to the wall.
image: /img/products/over-toilet-shelf/image.jpg
imageAlt: Slim wood and white shelf over a toilet with rolled towels and baskets
imageType: illustrative
features:
  - Legs straddle the toilet
  - Open shelves or a closed cabinet
  - Adjustable feet on many models
pros:
  - Uses the most-wasted wall in the bathroom
  - No drilling into tile
  - Looks built-in with matching baskets
cons:
  - Can be top-heavy — use the anti-tip strap if allowed
  - May block access to the tank lid if too low
check:
  - Toilet tank width vs. inside leg width
  - Floor-to-tank-top height
  - Location of the water shut-off valve
