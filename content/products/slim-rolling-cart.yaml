name: Simple Houseware 3-Tier Slim Rolling Cart with Handle
badge: Editor's Pick
category: space-saving-furniture
guide: rolling-storage-carts
description: A 5.5-inch-wide rolling cart that turns the narrow gap beside a fridge, washer or vanity into three shelves.
image: /img/products/slim-rolling-cart/image.jpg
imageAlt: Sage green three-tier rolling cart with spice jars and towels beside a refrigerator
imageType: illustrative
features:
- About 5.5 in W x 18 in D x 27.5 in H
- Three perforated shelves with raised edges
- Removable handle and side hooks
- Four casters, two of them lockable
pros:
- No installation or drilling
- Moves between rooms
- Uses space that is usually wasted
cons:
- Slim carts can tip if the top tier is overloaded
- Plastic shelves suit light items, not heavy cans in bulk
check:
- Gap width — this cart needs roughly 5.75 in or more
- Depth available (about 18 in)
- Height under countertops (about 27.5 in)
