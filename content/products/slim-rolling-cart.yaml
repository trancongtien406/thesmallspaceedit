name: Slim Rolling Storage Cart
badge: Editor's Pick
category: space-saving-furniture
guide: rolling-storage-carts
description: Turns the narrow gap beside a fridge, washer or vanity into three or four shelves.
image: /img/products/slim-rolling-cart/image.jpg
imageAlt: Sage green three-tier rolling cart with spice jars and towels beside a refrigerator
imageType: illustrative
features:
  - Narrow footprint (often 5–10 in wide)
  - Shelves with raised lips
  - Casters, ideally lockable
pros:
  - No installation or drilling
  - Moves between rooms
  - Uses space that is usually wasted
cons:
  - Slim models can tip if the top tier is overloaded
  - Small casters roll poorly on thick carpet
check:
  - Gap width at floor and top (leave ~½ in each side)
  - Height under countertops
  - Weight limit per shelf
