name: Simple Houseware 24-Pocket Over-the-Door Organizer
badge: Renter-Friendly
category: closet-organization
guide: small-closet-organization-hacks
description: Twenty-four clear pockets on the back of a door for shoes, snacks or accessories — no tools.
image: /img/products/over-door-organizer/image.jpg
imageAlt: Beige over-the-door pocket organizer holding a scarf, wallet and gloves
imageType: illustrative
features:
- About 19 in W x 64 in H
- 24 clear pockets (about 4.3 x 9.5 in each)
- 4 metal over-door hooks
- Several color options
pros:
- Installs in seconds
- Uses an ignored surface
- Frees closet floor space
cons:
- Hooks fit doors up to about 1-3/8 in thick
- Pockets are narrow for large sneakers
check:
- Door thickness (up to about 1-3/8 in)
- Gap at the top of the door frame
- Pocket size vs. what you will store
