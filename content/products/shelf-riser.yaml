name: Expandable Cabinet Shelf Riser
badge: Budget Friendly
category: small-kitchen
guide: cabinet-shelf-risers
description: Adds a second level inside a cabinet so plates, bowls or mugs stop wasting vertical space.
image: /img/products/shelf-riser/image.jpg
imageAlt: Open cabinet with white wire shelf risers holding plates above bowls
imageType: illustrative
features:
  - Wire, bamboo or coated metal
  - Expandable or stackable options
  - Tool-free
pros:
  - Simple way to double a shelf
  - Renter-friendly
  - Works in pantries and vanities too
cons:
  - Too short a riser is useless — measure first
  - Cheap risers can bow under heavy stoneware
check:
  - Height of the stack that goes underneath + ½ in
  - Interior width and depth
  - Door opening width
